name: Feature request
description: Suggest a new module, setting or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you need it?
      description: The problem it solves or the use case behind it.
    validations:
      required: true
